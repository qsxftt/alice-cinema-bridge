services:
  torrserver:
    image: yourok/torrserver:latest
    container_name: torrserver
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - TS_DONT_KILL=1
      - TS_CONF_PATH=/opt/ts/db
    volumes:
      - ./torrserver/db:/opt/ts/db

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    volumes:
      - ./prowlarr/config:/config
